<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AirMétro · envoyer des mesures</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#0b1020;--panel:#141b33;--panel2:#1b2442;--line:#2a3558;--tx:#eef1fb;--mut:#97a2c7;--acc:#7b8cff;--ok:#2ea043;--bad:#e5484d}
@media (prefers-color-scheme:light){:root{--bg:#eef1f8;--panel:#fff;--panel2:#f2f4fb;--line:#d5daea;--tx:#141a33;--mut:#5a6486;--acc:#4256e0}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:18px 16px 50px;display:grid;gap:14px}
a{color:var(--acc);font-weight:700}h1{margin:0;font-size:1.4rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
label{display:block;font-weight:700;margin:10px 0 4px}
input[type=password],input[type=file]{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--tx);font:inherit}
button{font:inherit;font-weight:800;padding:12px 18px;border-radius:12px;border:0;background:var(--acc);color:#fff;cursor:pointer;margin-top:12px}
button:disabled{opacity:.45;cursor:not-allowed}
.mut{color:var(--mut)}.small{font-size:.88rem}
table{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:8px}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.msg{margin-top:12px;font-weight:700}.ok{color:var(--ok)}.bad{color:var(--bad)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main>
  <p style="margin:0"><a href="index.html">← Retour à la carte</a></p>
  <h1>Envoyer des mesures</h1>
  <p class="mut" style="margin:0">Réservé à la personne qui possède le capteur. Choisissez le ou les fichiers CSV téléchargés en sortant du métro (ou le fichier complet du capteur), puis envoyez-les. Seules les moyennes par station et par ligne sont publiées, sans identité.</p>

  <section class="card">
    <label for="key">Clé d'envoi</label>
    <input id="key" type="password" autocomplete="off" placeholder="la clé définie à l'installation">
    <label for="files">Fichiers CSV</label>
    <input id="files" type="file" accept=".csv,text/csv,text/plain" multiple>
    <div id="preview"></div>
    <button id="send" disabled>Envoyer au site</button>
    <div class="msg" id="msg" role="status"></div>
  </section>
</main>
<script>
"use strict";
const $=id=>document.getElementById(id);
try{$("key").value=localStorage.getItem("airmetro.site.key")||""}catch(e){}
let visits=[];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Lit un CSV du capteur (2 formats) et le regroupe en passages (une station + une ligne d'affilée) */
function parseCsv(text){
  const lines=text.split(/\r?\n/).filter(Boolean),out=[];if(!lines.length)return out;
  const head=lines[0].split(",").map(s=>s.trim().toLowerCase());
  const ix=n=>head.findIndex(h=>h.startsWith(n));
  const iT=ix("datetime_utc")>=0?ix("datetime_utc"):ix("t_unix_utc"),iS=ix("station"),iL=ix("ligne"),i25=ix("pm25"),i10=ix("pm10"),iTp=ix("temperature"),iHu=ix("humidity"),iPr=ix("pressure");
  if(iT<0||iS<0||iL<0||i25<0||i10<0)throw new Error("Format de fichier non reconnu");
  const num=v=>v===undefined||v===""?null:(isFinite(+v)?+v:null);
  const recs=[];
  for(let k=1;k<lines.length;k++){const f=lines[k].split(",");let t=f[iT];t=/^\d+$/.test(t)?+t:Math.floor(Date.parse(t)/1000);
    if(!t||!f[iL])continue;const a=num(f[i25]),b=num(f[i10]);if(a==null||b==null)continue;
    recs.push({t,n:f[iS],l:f[iL],a,b,tp:iTp>=0?num(f[iTp]):null,hu:iHu>=0?num(f[iHu]):null,pr:iPr>=0?num(f[iPr]):null})}
  recs.sort((x,y)=>x.t-y.t);
  let cur=null;
  const flush=()=>{if(!cur)return;const m=k=>{const v=cur.r.map(r=>r[k]).filter(x=>x!=null);return v.length?v.reduce((s,x)=>s+x,0)/v.length:null};
    out.push({t:cur.t,name:cur.n,line:cur.l,c:cur.r.length,a:m("a"),b:m("b"),x:Math.max(...cur.r.map(r=>r.a)),tp:m("tp"),hu:m("hu"),pr:m("pr")});cur=null};
  recs.forEach(r=>{if(cur&&(cur.n!==r.n||cur.l!==r.l||r.t-cur.last>1800))flush();if(!cur)cur={n:r.n,l:r.l,t:r.t,last:r.t,r:[]};cur.r.push(r);cur.last=r.t});
  flush();return out}

$("files").addEventListener("change",async()=>{
  visits=[];$("msg").textContent="";$("msg").className="msg";
  try{for(const f of $("files").files)visits.push(...parseCsv(await f.text()))}catch(e){$("msg").textContent=e.message;$("msg").className="msg bad"}
  const seen=new Set();visits=visits.filter(v=>{const k=v.t+"|"+v.name+"|"+v.line;if(seen.has(k))return false;seen.add(k);return true});
  const n=visits.reduce((s,v)=>s+v.c,0);
  $("preview").innerHTML=visits.length?`<p class="small mut">${n} mesures regroupées en ${visits.length} passages.</p><table><tr><th>Date</th><th>Station</th><th>Ligne</th><th>Mesures</th><th>PM2.5</th></tr>${visits.slice(0,12).map(v=>`<tr><td>${new Date(v.t*1000).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</td><td>${esc(v.name)}</td><td>${esc(v.line)}</td><td>${v.c}</td><td>${v.a.toFixed(1)}</td></tr>`).join("")}</table>${visits.length>12?`<p class="small mut">… et ${visits.length-12} autres.</p>`:""}`:"";
  $("send").disabled=!visits.length});

$("send").onclick=async()=>{
  const key=$("key").value.trim(),msg=$("msg");if(!key){msg.textContent="Entrez la clé d'envoi.";msg.className="msg bad";return}
  try{localStorage.setItem("airmetro.site.key",key)}catch(e){}
  $("send").disabled=true;msg.className="msg";msg.textContent="Envoi…";let acc=0,rej=0;
  try{for(let i=0;i<visits.length;i+=100){
      const r=await fetch("/api/upload",{method:"POST",headers:{"Content-Type":"application/json","X-Key":key},body:JSON.stringify({visits:visits.slice(i,i+100)})});
      const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||("Erreur "+r.status));acc+=j.accepted;rej+=j.rejected}
    msg.textContent=`Envoyé : ${acc} passages acceptés${rej?`, ${rej} refusés (station inconnue ou valeur aberrante)`:""}. Merci !`;msg.className="msg ok"}
  catch(e){msg.textContent=e.message;msg.className="msg bad";$("send").disabled=false}};
</script>
</body>
</html>
